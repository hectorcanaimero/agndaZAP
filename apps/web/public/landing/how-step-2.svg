<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-hidden="true">
  <!-- Placeholder Batch 3 — dos burbujas de horarios + slot confirmado con check.
       Estilo flat, brand navy #0F2A4A + teal #28D9B9 + WhatsApp green #25D366. -->
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132F52" />
      <stop offset="1" stop-color="#0F2A4A" />
    </linearGradient>
    <filter id="soft2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg2)" />
  <circle cx="80" cy="500" r="140" fill="#28D9B9" opacity="0.14" filter="url(#soft2)" />
  <circle cx="720" cy="120" r="120" fill="#28D9B9" opacity="0.10" filter="url(#soft2)" />

  <!-- Panel izquierdo: horarios propuestos -->
  <g transform="translate(60 100)">
    <!-- Bubble título (bot) -->
    <g>
      <rect x="0" y="0" width="280" height="52" rx="14" fill="#FFFFFF" />
      <rect x="16" y="16" width="200" height="8" rx="4" fill="#0F2A4A" opacity="0.85" />
      <rect x="16" y="32" width="140" height="6" rx="3" fill="#0F2A4A" opacity="0.5" />
    </g>

    <!-- Slot 1 -->
    <g transform="translate(0 72)">
      <rect x="0" y="0" width="280" height="56" rx="14" fill="#FFFFFF" />
      <circle cx="30" cy="28" r="14" fill="#28D9B9" opacity="0.18" />
      <path d="M30 20 v10 l7 4" stroke="#0F2A4A" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <rect x="56" y="16" width="88" height="10" rx="5" fill="#0F2A4A" opacity="0.88" />
      <rect x="56" y="32" width="150" height="6" rx="3" fill="#0F2A4A" opacity="0.45" />
    </g>

    <!-- Slot 2 -->
    <g transform="translate(0 144)">
      <rect x="0" y="0" width="280" height="56" rx="14" fill="#FFFFFF" />
      <circle cx="30" cy="28" r="14" fill="#28D9B9" opacity="0.18" />
      <path d="M30 20 v10 l7 4" stroke="#0F2A4A" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <rect x="56" y="16" width="88" height="10" rx="5" fill="#0F2A4A" opacity="0.88" />
      <rect x="56" y="32" width="150" height="6" rx="3" fill="#0F2A4A" opacity="0.45" />
    </g>

    <!-- Slot 3 destacado -->
    <g transform="translate(0 216)">
      <rect x="0" y="0" width="280" height="56" rx="14" fill="#28D9B9" />
      <circle cx="30" cy="28" r="14" fill="#FFFFFF" opacity="0.25" />
      <path d="M30 20 v10 l7 4" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" fill="none" />
      <rect x="56" y="16" width="88" height="10" rx="5" fill="#0F2A4A" opacity="0.95" />
      <rect x="56" y="32" width="150" height="6" rx="3" fill="#0F2A4A" opacity="0.65" />
    </g>

    <!-- Respuesta del paciente -->
    <g transform="translate(150 302)">
      <rect x="0" y="0" width="130" height="46" rx="14" fill="#DCF8C6" />
      <text x="65" y="30" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#0F2A4A" text-anchor="middle">3</text>
    </g>
  </g>

  <!-- Panel derecho: card confirmada -->
  <g transform="translate(430 130)">
    <rect x="0" y="0" width="300" height="340" rx="24" fill="#FFFFFF" />
    <!-- Header teal -->
    <rect x="0" y="0" width="300" height="80" rx="24" fill="#28D9B9" />
    <rect x="0" y="56" width="300" height="24" fill="#28D9B9" />
    <!-- Anillos calendario -->
    <rect x="70" y="-8" width="8" height="26" rx="4" fill="#FFFFFF" />
    <rect x="222" y="-8" width="8" height="26" rx="4" fill="#FFFFFF" />
    <!-- Check grande -->
    <circle cx="150" cy="42" r="24" fill="#FFFFFF" />
    <path d="M138 42 l10 10 l16 -20" stroke="#28D9B9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Grid mini calendario -->
    <g transform="translate(30 106)">
      <rect x="0" y="0" width="240" height="8" rx="4" fill="#0F2A4A" opacity="0.8" />
      <rect x="0" y="20" width="180" height="6" rx="3" fill="#0F2A4A" opacity="0.5" />

      <!-- Días -->
      <g transform="translate(0 48)" fill="#28D9B9" opacity="0.22">
        <rect x="0"   y="0"  width="26" height="26" rx="6" />
        <rect x="34"  y="0"  width="26" height="26" rx="6" />
        <rect x="68"  y="0"  width="26" height="26" rx="6" />
        <rect x="102" y="0"  width="26" height="26" rx="6" />
        <rect x="136" y="0"  width="26" height="26" rx="6" />
        <rect x="170" y="0"  width="26" height="26" rx="6" />
        <rect x="204" y="0"  width="26" height="26" rx="6" />

        <rect x="0"   y="34" width="26" height="26" rx="6" />
        <rect x="34"  y="34" width="26" height="26" rx="6" />
        <rect x="68"  y="34" width="26" height="26" rx="6" />
      </g>

      <!-- Día seleccionado -->
      <g transform="translate(102 82)">
        <rect x="0" y="0" width="26" height="26" rx="6" fill="#28D9B9" />
        <circle cx="13" cy="13" r="4" fill="#FFFFFF" />
      </g>

      <!-- Info hora -->
      <g transform="translate(0 148)">
        <rect x="0" y="0" width="140" height="10" rx="5" fill="#0F2A4A" opacity="0.85" />
        <rect x="0" y="20" width="90" height="8" rx="4" fill="#28D9B9" />
      </g>
    </g>
  </g>

  <!-- Chip inferior "Confirmada" -->
  <g transform="translate(60 500)">
    <rect x="0" y="0" width="150" height="34" rx="17" fill="#25D366" opacity="0.2" />
    <circle cx="20" cy="17" r="7" fill="#25D366" />
    <path d="M16 17 l3 3 l7 -6" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="36" y="12" width="100" height="10" rx="5" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>

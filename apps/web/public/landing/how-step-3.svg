<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-hidden="true">
  <!-- Placeholder Batch 3 — mockup ilustrado del panel Showly.
       Sidebar navy con conversaciones + agenda del día en cards + KPI teal. -->
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132F52" />
      <stop offset="1" stop-color="#0F2A4A" />
    </linearGradient>
    <filter id="soft3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg3)" />
  <circle cx="720" cy="500" r="140" fill="#28D9B9" opacity="0.14" filter="url(#soft3)" />
  <circle cx="120" cy="100" r="120" fill="#28D9B9" opacity="0.10" filter="url(#soft3)" />

  <!-- Ventana del panel -->
  <g transform="translate(60 60)">
    <rect x="0" y="0" width="680" height="480" rx="18" fill="#FFFFFF" />

    <!-- Barra superior con dots -->
    <rect x="0" y="0" width="680" height="34" rx="18" fill="#F5F7F9" />
    <rect x="0" y="18" width="680" height="16" fill="#F5F7F9" />
    <circle cx="20" cy="17" r="5" fill="#E4E7EA" />
    <circle cx="38" cy="17" r="5" fill="#E4E7EA" />
    <circle cx="56" cy="17" r="5" fill="#E4E7EA" />

    <!-- Sidebar -->
    <rect x="0" y="34" width="200" height="446" fill="#0F2A4A" />
    <rect x="0" y="34" width="200" height="446" fill="url(#bg3)" />

    <!-- Logo sidebar -->
    <g transform="translate(18 54)">
      <rect x="0" y="0" width="24" height="24" rx="7" fill="#28D9B9" />
      <path d="M8 12 h8 M12 8 v8" stroke="#0F2A4A" stroke-width="2.5" stroke-linecap="round" />
      <rect x="34" y="8" width="80" height="8" rx="4" fill="#FFFFFF" opacity="0.9" />
    </g>

    <!-- Lista de conversaciones -->
    <g transform="translate(0 100)" font-family="Inter, sans-serif">
      <!-- Título sección -->
      <rect x="18" y="0" width="90" height="8" rx="4" fill="#28D9B9" opacity="0.7" />

      <!-- Item 1 (activo) -->
      <g transform="translate(0 24)">
        <rect x="0" y="0" width="200" height="52" fill="#28D9B9" opacity="0.14" />
        <rect x="0" y="0" width="4" height="52" fill="#28D9B9" />
        <circle cx="34" cy="26" r="14" fill="#28D9B9" />
        <text x="34" y="31" font-size="14" font-weight="700" fill="#0F2A4A" text-anchor="middle">M</text>
        <rect x="58" y="16" width="100" height="8" rx="4" fill="#FFFFFF" opacity="0.95" />
        <rect x="58" y="30" width="120" height="6" rx="3" fill="#FFFFFF" opacity="0.5" />
        <circle cx="182" cy="24" r="7" fill="#25D366" />
      </g>

      <!-- Item 2 -->
      <g transform="translate(0 84)">
        <circle cx="34" cy="26" r="14" fill="#FFFFFF" opacity="0.18" />
        <text x="34" y="31" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">L</text>
        <rect x="58" y="16" width="90" height="8" rx="4" fill="#FFFFFF" opacity="0.85" />
        <rect x="58" y="30" width="110" height="6" rx="3" fill="#FFFFFF" opacity="0.4" />
      </g>

      <!-- Item 3 -->
      <g transform="translate(0 136)">
        <circle cx="34" cy="26" r="14" fill="#FFFFFF" opacity="0.18" />
        <text x="34" y="31" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">J</text>
        <rect x="58" y="16" width="80" height="8" rx="4" fill="#FFFFFF" opacity="0.85" />
        <rect x="58" y="30" width="100" height="6" rx="3" fill="#FFFFFF" opacity="0.4" />
      </g>

      <!-- Item 4 -->
      <g transform="translate(0 188)">
        <circle cx="34" cy="26" r="14" fill="#FFFFFF" opacity="0.18" />
        <text x="34" y="31" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">R</text>
        <rect x="58" y="16" width="70" height="8" rx="4" fill="#FFFFFF" opacity="0.85" />
        <rect x="58" y="30" width="120" height="6" rx="3" fill="#FFFFFF" opacity="0.4" />
      </g>

      <!-- Item 5 -->
      <g transform="translate(0 240)">
        <circle cx="34" cy="26" r="14" fill="#FFFFFF" opacity="0.18" />
        <text x="34" y="31" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
        <rect x="58" y="16" width="85" height="8" rx="4" fill="#FFFFFF" opacity="0.85" />
        <rect x="58" y="30" width="90" height="6" rx="3" fill="#FFFFFF" opacity="0.4" />
      </g>
    </g>

    <!-- Header área principal -->
    <g transform="translate(220 54)">
      <rect x="0" y="0" width="180" height="14" rx="7" fill="#0F2A4A" opacity="0.9" />
      <rect x="0" y="24" width="120" height="8" rx="4" fill="#0F2A4A" opacity="0.45" />

      <!-- KPI no-show -->
      <g transform="translate(300 -4)">
        <rect x="0" y="0" width="140" height="52" rx="12" fill="#28D9B9" opacity="0.16" />
        <rect x="0" y="0" width="4" height="52" rx="2" fill="#28D9B9" />
        <rect x="16" y="10" width="60" height="8" rx="4" fill="#0F2A4A" opacity="0.7" />
        <text x="16" y="42" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#0F2A4A">-32%</text>
        <path d="M120 30 l-8 -12 l-8 12" stroke="#28D9B9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      </g>
    </g>

    <!-- Agenda del día — columnas horarias -->
    <g transform="translate(220 130)">
      <!-- Tabs -->
      <rect x="0" y="0" width="70" height="28" rx="14" fill="#28D9B9" />
      <rect x="12" y="8" width="46" height="12" rx="6" fill="#0F2A4A" opacity="0.85" />
      <rect x="82" y="0" width="70" height="28" rx="14" fill="#F5F7F9" />
      <rect x="94" y="8" width="46" height="12" rx="6" fill="#0F2A4A" opacity="0.35" />
      <rect x="164" y="0" width="70" height="28" rx="14" fill="#F5F7F9" />
      <rect x="176" y="8" width="46" height="12" rx="6" fill="#0F2A4A" opacity="0.35" />

      <!-- Grid horarios -->
      <g transform="translate(0 50)">
        <!-- Etiquetas horarias -->
        <g font-family="Inter, sans-serif" font-size="10" fill="#0F2A4A" opacity="0.55">
          <text x="0" y="14">09:00</text>
          <text x="0" y="72">10:00</text>
          <text x="0" y="130">11:00</text>
          <text x="0" y="188">12:00</text>
          <text x="0" y="246">13:00</text>
        </g>

        <!-- Líneas guía -->
        <g stroke="#E4E7EA" stroke-width="1">
          <line x1="34" y1="10" x2="440" y2="10" />
          <line x1="34" y1="68" x2="440" y2="68" />
          <line x1="34" y1="126" x2="440" y2="126" />
          <line x1="34" y1="184" x2="440" y2="184" />
          <line x1="34" y1="242" x2="440" y2="242" />
        </g>

        <!-- Cita 1 -->
        <g transform="translate(50 6)">
          <rect x="0" y="0" width="120" height="48" rx="8" fill="#28D9B9" opacity="0.22" />
          <rect x="0" y="0" width="4" height="48" rx="2" fill="#28D9B9" />
          <rect x="12" y="10" width="80" height="8" rx="4" fill="#0F2A4A" opacity="0.85" />
          <rect x="12" y="26" width="60" height="6" rx="3" fill="#0F2A4A" opacity="0.5" />
        </g>

        <!-- Cita 2 -->
        <g transform="translate(180 24)">
          <rect x="0" y="0" width="120" height="66" rx="8" fill="#25D366" opacity="0.16" />
          <rect x="0" y="0" width="4" height="66" rx="2" fill="#25D366" />
          <rect x="12" y="12" width="70" height="8" rx="4" fill="#0F2A4A" opacity="0.85" />
          <rect x="12" y="28" width="90" height="6" rx="3" fill="#0F2A4A" opacity="0.5" />
          <rect x="12" y="44" width="50" height="6" rx="3" fill="#25D366" opacity="0.9" />
        </g>

        <!-- Cita 3 -->
        <g transform="translate(50 82)">
          <rect x="0" y="0" width="120" height="60" rx="8" fill="#28D9B9" opacity="0.22" />
          <rect x="0" y="0" width="4" height="60" rx="2" fill="#28D9B9" />
          <rect x="12" y="12" width="60" height="8" rx="4" fill="#0F2A4A" opacity="0.85" />
          <rect x="12" y="28" width="90" height="6" rx="3" fill="#0F2A4A" opacity="0.5" />
        </g>

        <!-- Cita 4 (más chica) -->
        <g transform="translate(310 100)">
          <rect x="0" y="0" width="120" height="42" rx="8" fill="#0F2A4A" opacity="0.10" />
          <rect x="0" y="0" width="4" height="42" rx="2" fill="#0F2A4A" opacity="0.4" />
          <rect x="12" y="10" width="70" height="8" rx="4" fill="#0F2A4A" opacity="0.7" />
          <rect x="12" y="24" width="50" height="6" rx="3" fill="#0F2A4A" opacity="0.4" />
        </g>

        <!-- Cita 5 -->
        <g transform="translate(180 152)">
          <rect x="0" y="0" width="120" height="50" rx="8" fill="#28D9B9" opacity="0.22" />
          <rect x="0" y="0" width="4" height="50" rx="2" fill="#28D9B9" />
          <rect x="12" y="12" width="80" height="8" rx="4" fill="#0F2A4A" opacity="0.85" />
          <rect x="12" y="28" width="60" height="6" rx="3" fill="#0F2A4A" opacity="0.5" />
        </g>

        <!-- Cita 6 -->
        <g transform="translate(50 208)">
          <rect x="0" y="0" width="120" height="42" rx="8" fill="#28D9B9" opacity="0.22" />
          <rect x="0" y="0" width="4" height="42" rx="2" fill="#28D9B9" />
          <rect x="12" y="10" width="80" height="8" rx="4" fill="#0F2A4A" opacity="0.85" />
          <rect x="12" y="24" width="60" height="6" rx="3" fill="#0F2A4A" opacity="0.5" />
        </g>
      </g>
    </g>
  </g>
</svg>

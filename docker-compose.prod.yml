# AgendaZap — Docker Compose para producción
#
# Diferencias clave respecto a `docker-compose.yml` (dev):
#  - Sin `platform: linux/amd64` (asumimos server x86_64 nativo).
#  - db + redis SIN puerto expuesto a host (accesibles sólo por la red interna).
#  - Volúmenes en paths absolutos del host (`/srv/agendazap/data/*`).
#  - `restart: unless-stopped` en TODOS los servicios.
#  - `backend` + `web` con Dockerfiles multi-stage (context = raíz del repo).
#  - Env vars vienen de `.env.production` (NO commiteado, copiarlo al servidor).
#  - Caddy como reverse proxy con TLS gratis (Let's Encrypt).
#  - Healthchecks en TODOS los services para orquestación limpia + Caddy espera
#    a `service_healthy` en `backend` + `web`.
#  - `logging` con rotación json-file (50 MB × 5 archivos ≈ 250 MB por service).
#  - `waha` pineado a `devlikeapro/waha:latest` (ver docs/deploy.md — si hay
#    tag estable, preferirlo).
#
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Ver docs/deploy.md para el walk-through completo.

# Config compartida de logging: json-file con rotación agresiva. Aplica a
# TODOS los services vía YAML anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: pgvector/pgvector:pg15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - /srv/agendazap/data/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging
    # NO expone puerto 5432 al host — sólo accesible en la red del compose.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /srv/agendazap/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging
    # NO expone puerto 6379 al host.

  waha:
    # Pineamos a `latest` durante piloto; si `devlikeapro/waha` publica tag
    # estable (ej: `2024.11` o similar), preferirlo — evita breaking changes
    # silenciosos en updates. Ver docs/deploy.md §7bis.
    image: devlikeapro/waha:latest
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_HOOK_URL: http://backend:4000/webhooks/waha
      WHATSAPP_HOOK_EVENTS: message,session.status
      WHATSAPP_HOOK_HEADERS: "x-webhook-token: ${WEBHOOK_TOKEN}"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      # Dashboard admin (protegido por auth básica).
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD}
    volumes:
      - /srv/agendazap/data/waha:/app/.sessions
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    # WAHA dashboard sólo accesible via Caddy reverse proxy (con auth
    # básica extra si querés). NO expone 3000 al host directo.

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      waha:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: "4000"
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN}
      JWT_SECRET: ${JWT_SECRET}
      TRUST_PROXY: "true"
      CORS_ORIGINS: ${CORS_ORIGINS}
      BOT_LLM_PROVIDER: ${BOT_LLM_PROVIDER:-deepseek}
      BOT_LLM_FALLBACK: ${BOT_LLM_FALLBACK:-gemini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging: *default-logging
    # No expone 4000 al host — Caddy hace de reverse proxy.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3002"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3002/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging: *default-logging
    # No expone 3002 al host — Caddy reverse proxy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/agendazap/data/caddy/data:/data
      - /srv/agendazap/data/caddy/config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
      waha:
        condition: service_started
    logging: *default-logging

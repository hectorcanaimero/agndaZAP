name: CI

# Corre en PRs contra las branches "integration" (staged) y "prod" (main),
# y también en push directo a esas branches (post-merge sanity check).
on:
  pull_request:
    branches: [staged, main]
  push:
    branches: [staged, main]

# Cancela runs viejos si se pushea de nuevo al mismo PR — ahorra minutos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fuerza no-interactive en instaladores y hace que los logs sean parseables.
  CI: true
  # pnpm ejecuta más chill con esta env (evita prompts de fixes automáticos).
  PNPM_HOME: /home/runner/.local/share/pnpm

jobs:
  # ─────────────────────────── BACKEND ───────────────────────────
  # tsc + jest. NO ejecutamos migrate ni levantamos servicios reales —
  # los tests usan mocks (`jest.fn()`), no conectan a Postgres/Redis.
  backend:
    name: Backend — tsc + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version viene del `packageManager` en package.json — cero deriva
      # entre CI y local. Pasar `version:` acá causa ERR_PNPM_BAD_PM_VERSION
      # cuando action-setup detecta ambas fuentes.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      # Prisma Client se genera al install (postinstall del package), pero
      # explicitarlo evita sorpresas si en algún momento se saca ese hook.
      - name: Prisma generate
        working-directory: apps/backend
        run: pnpm exec prisma generate

      - name: TypeScript check
        working-directory: apps/backend
        run: pnpm exec tsc --noEmit

      # Los scripts de `prisma/` (seed, reindex) quedan fuera del tsconfig base
      # — su `include` es solo `src/**/*`. Sin este paso, un cambio de firma en
      # un service los rompe en silencio y solo se ve cuando el job E2E ejecuta
      # el seed: tarde, en un job caro y con un error que no señala al PR
      # culpable. Pasó con el constructor de KnowledgeService (2026-09-11).
      - name: TypeScript check (scripts de prisma/)
        working-directory: apps/backend
        run: pnpm typecheck:scripts

      # `pnpm test:ci` y no `pnpm test`: el código de salida de Jest cubre un
      # suite que no arranca o un fichero sin tests, pero NO cubre los tests
      # que existen y no se ejecutaron. Un `it.only` olvidado deja el resto del
      # fichero sin correr y Jest sale 0 diciendo "1 passed" — incluidos los
      # tests que habrían fallado. Verificado contra esta versión de Jest.
      - name: Unit tests
        working-directory: apps/backend
        run: pnpm test:ci

  # ──────────────────── BACKEND (integración) ────────────────────
  # Los unitarios usan mocks de Redis, y los mocks se desvían de Redis: un mock
  # de `del` que solo borraba claves string dejó pasar un test del índice de
  # tokens, cuando el DEL real borra la clave sea del tipo que sea. Este job
  # ejercita contra un Redis de verdad lo que un mock no puede demostrar —
  # atomicidad de SET NX e INCR, expiración, tipos de clave y el dedup por
  # `jobId` de BullMQ.
  #
  # Separado del job `backend` a propósito: los unitarios deben seguir corriendo
  # en segundos y sin servicios, que es lo que hace que se ejecuten a menudo.
  backend-integration:
    name: Backend — tests de integración (Redis)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        # Sin el healthcheck, los tests pueden arrancar antes de que Redis
        # acepte conexiones y fallar con un ECONNREFUSED que parece un bug.
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        working-directory: apps/backend
        run: pnpm exec prisma generate

      - name: Integration tests
        working-directory: apps/backend
        env:
          REDIS_URL: redis://127.0.0.1:6379
        run: pnpm test:int

  # ─────────────────────────── WEB ───────────────────────────
  # tsc + i18n validation + `next build`. El build se agregó en el sprint 0
  # (2026-09-09): un error de tipos en un componente sin importar rompió el
  # deploy en Coolify sin que CI lo viera. Sentry va deshabilitado en CI
  # para no requerir SENTRY_AUTH_TOKEN ni subir source maps.
  web:
    name: Web — tsc + i18n + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version viene del `packageManager` en package.json — cero deriva
      # entre CI y local. Pasar `version:` acá causa ERR_PNPM_BAD_PM_VERSION
      # cuando action-setup detecta ambas fuentes.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      # i18n check custom — valida paridad estricta es/pt + missing keys por
      # consumidor. Ver scripts/i18n-check.mjs para el detalle.
      - name: i18n check (paridad + missing keys)
        run: node scripts/i18n-check.mjs

      # Mismo comando que corre el Dockerfile de producción. La URL del API
      # es un placeholder: sólo se hornea en el bundle, no se llama en build.
      - name: Next build
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_SENTRY_ENABLED: "false"
          SENTRY_ENABLED: "false"
        run: pnpm build

  # ─────────────────────────── E2E ───────────────────────────
  # Smoke Playwright (chromium) de la página pública de agendamiento —
  # sprint 2 (s2-10). Postgres+Redis como `services:`; el backend y el web
  # corren en background en el runner (sin WAHA: el backend no lo exige para
  # arrancar, el health-monitor sólo loguea el error). Ver
  # docs/smoke-e2e.md §Automatizado y scripts/e2e-local.sh (mismo flujo).
  e2e:
    name: E2E — Playwright smoke (agendar)
    runs-on: ubuntu-latest
    needs: [backend, web]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: showly
          POSTGRES_PASSWORD: showly
          POSTGRES_DB: showly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U showly"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Backend — env mínima de test. NODE_ENV=test evita el fail-fast de
      # prod (`validateProdEnv`) y permite el seed. Nada de esto es secreto.
      NODE_ENV: test
      DATABASE_URL: postgresql://showly:showly@localhost:5432/showly
      REDIS_URL: redis://localhost:6379
      PORT: "4102"
      JWT_SECRET: ci-jwt-secret-de-prueba-con-mas-de-32-caracteres
      WEBHOOK_TOKEN: ci-webhook-token
      WAHA_BASE_URL: http://127.0.0.1:9
      WAHA_API_KEY: ci-waha-key
      WAHA_HEALTH_INTERVAL_MIN: "60"
      CORS_ORIGINS: http://localhost:3102
      ICAL_SECRET: ci-ical-secret
      SENTRY_ENABLED: "false"
      AXIOM_ENABLED: "false"
      LOG_LEVEL: warn
      LOG_PRETTY: "false"
      BOT_TYPING_ENABLED: "false"
      APP_BASE_URL: http://localhost:3102
      WEB_BASE_URL: http://localhost:3102
      # Web (build-time) + Playwright.
      NEXT_PUBLIC_API_URL: http://localhost:4102
      NEXT_PUBLIC_SENTRY_ENABLED: "false"
      E2E_API_URL: http://localhost:4102
      E2E_WEB_URL: http://localhost:3102
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Prisma generate
        working-directory: apps/backend
        run: pnpm exec prisma generate
      # Cache del browser: la key incluye la versión de @playwright/test
      # (cada release cambia la revisión de chromium). `install` con cache
      # hit es casi no-op (sólo valida) pero `--with-deps` igual instala las
      # libs de sistema, que no se cachean.
      - name: Playwright version
        id: pw
        working-directory: apps/web
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install chromium (solo CI)
        working-directory: apps/web
        run: pnpm exec playwright install chromium --with-deps
      - name: Migrate + seed
        working-directory: apps/backend
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed
      - name: Build backend + web
        run: |
          pnpm --filter @showly/backend build
          pnpm --filter @showly/web build
      - name: Start backend + web (background)
        run: |
          (cd apps/backend && nohup node dist/main.js > "$RUNNER_TEMP/backend.log" 2>&1 &)
          (cd apps/web && nohup pnpm exec next start -p 3102 > "$RUNNER_TEMP/web.log" 2>&1 &)
      - name: Wait for backend + web
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:4102/api/health/live && break; sleep 2; done
          curl -sf http://localhost:4102/api/health/live
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3102/es/agendar/demo && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:3102/es/agendar/demo
      - name: Playwright smoke
        run: pnpm --filter @showly/web e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
      - name: Server logs (on failure)
        if: failure()
        run: |
          echo "::group::backend.log"; cat "$RUNNER_TEMP/backend.log" || true; echo "::endgroup::"
          echo "::group::web.log"; cat "$RUNNER_TEMP/web.log" || true; echo "::endgroup::"

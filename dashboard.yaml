# Dashboard UX defaults. Applied when a request omits the corresponding
# query param, so URL bookmarks always win.
#
# Ship these defaults with the package; a project can override by dropping
# `<project_root>/dashboard.yaml` — same schema.
kanban:
  wip_default: null         # integer or null. null = no WIP badge unless ?wip=N.
  sort_default: null        # "impact" | null (default = phase asc + id asc).
  group_default: null       # "phase" | null.
  refresh_interval_s: 10    # HTMX polling cadence for the board.

# Tunnel manager (Sprint E-5). See docs/DASHBOARD-PROFILES.md for the full
# guide, security caveats, and CLI examples. Default is disabled — flip
# `enabled: true` to expose `/api/tunnel/*` (three-gate: config → operator
# profile → loopback host). Requires `autossh` on PATH (macOS: `brew install
# autossh`; Debian/Ubuntu: `sudo apt install autossh`).
tunnel:
  enabled: true
  provider: bore
  command: bore           # MUST equal the provider's pinned binary.
  # `args` forwarded verbatim to the subprocess. bore: local <port> --to bore.pub
  args:
    - "local"
    - "7420"
    - "--to"
    - "bore.pub"
  auto_start: false          # true = self-probe + spawn on dashboard boot.
  startup_probe_timeout_s: 3   # 1..30 — self-probe timeout for auto_start.
  url_parse_timeout_s: 30      # 5..300 — how long we wait for the URL line.

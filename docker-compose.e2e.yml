# Infra efímera para el smoke E2E (`scripts/e2e-local.sh`).
#
# Proyecto compose SEPARADO (`showly-e2e`) y puertos distintos (5433/6380)
# para no pisar el `showly-db-1`/`showly-redis-1` del `docker-compose.yml`
# que otro dev (u otra sesión de Claude) puede tener levantado con datos
# reales. Sin volúmenes persistentes: cada corrida arranca con DB vacía →
# migrate + seed. Sin WAHA: el backend no lo necesita para arrancar (ver
# docs/smoke-e2e.md §Automatizado).
name: showly-e2e
services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: showly
      POSTGRES_PASSWORD: showly
      POSTGRES_DB: showly
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showly"]
      interval: 2s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

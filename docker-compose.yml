# Nombre del proyecto compose: aterriza los containers como `showly-*`
# sin depender del nombre del folder de checkout. Ver `main.ts` (referencia
# a `docker exec showly-redis-1`) y `docs/smoke-e2e.md`.
name: showly

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: showly
      POSTGRES_PASSWORD: showly
      POSTGRES_DB: showly
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # WAHA — WhatsApp HTTP API (no oficial). Escanea el QR en http://localhost:3000
  # Engine NOWEB (Baileys): sin Chromium, ~30% más liviano y con arm64 nativo.
  # Tags separados por arquitectura: `noweb-arm` (Apple Silicon) · `noweb` (x86).
  # En prod x86, sobreescribí: WAHA_IMAGE_TAG=noweb
  waha:
    image: devlikeapro/waha:${WAHA_IMAGE_TAG:-noweb-arm}
    ports:
      - "3000:3000"
    environment:
      # engine por defecto al crear sesiones. NOWEB = Baileys, sin browser.
      # Nota: NOWEB no soporta botones/listas interactivas (solo WEBJS/WPP).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # token que WAHA exige en el header 'X-Api-Key'
      WAHA_API_KEY: ${WAHA_API_KEY:-dev-waha-key}
      # WAHA enviará los eventos entrantes a nuestro backend.
      # Default apunta al host desde el container (backend corriendo con `pnpm dev:backend`).
      # En modo full-docker (backend dentro del compose), overridear: WAHA_HOOK_URL=http://backend:4000/webhooks/waha
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_URL:-http://host.docker.internal:4000/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: message,session.status
      # NOTA: WAHA community (noweb-arm/noweb) NO envía headers custom
      # (WHATSAPP_HOOK_HEADERS es feature Plus). En prod, usar WEBHOOK_HMAC
      # o reverse-proxy con auth antes del endpoint.
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
    volumes:
      - waha_sessions:/app/.sessions

  backend:
    # El Dockerfile del backend espera contexto en la raíz del monorepo
    # (pnpm-workspace.yaml + packages/shared). No usar ./apps/backend.
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://showly:showly@db:5432/showly
      REDIS_URL: redis://redis:6379
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-dev-waha-key}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-dev-webhook-token}
      WEBHOOK_HMAC_SECRET: ${WEBHOOK_HMAC_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ICAL_SECRET: ${ICAL_SECRET:-dev-ical-secret}
      WAHA_HEALTH_INTERVAL_MIN: ${WAHA_HEALTH_INTERVAL_MIN:-5}
      # LLM router real (ver apps/backend/src/common/llm/llm-router.service.ts).
      LLM_PROVIDER_ORDER: ${LLM_PROVIDER_ORDER:-deepseek,opencode,gemini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-}
      OPENCODE_PLAN: ${OPENCODE_PLAN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}  # embeddings FAQ
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Showly <onboarding@showly.us>}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3002}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_PRETTY: ${LOG_PRETTY:-true}
      AXIOM_ENABLED: ${AXIOM_ENABLED:-false}
      AXIOM_DATASET_LOGS: ${AXIOM_DATASET_LOGS:-showly-prod}
      AXIOM_TOKEN: ${AXIOM_TOKEN:-}
      AXIOM_ORG_ID: ${AXIOM_ORG_ID:-}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  db_data:
  redis_data:
  waha_sessions:

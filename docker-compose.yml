# Infra de DEV: postgres(pgvector) + redis + waha. El backend y el web corren
# en el host con `pnpm dev`. Para dejar la DB migrada y con la data demo del
# seed en un solo paso: `pnpm dev:up` (ver scripts/dev-up.sh); para empezar
# de cero: `pnpm dev:reset`.
#
# Nombre del proyecto compose: aterriza los containers como `showly-*`
# sin depender del nombre del folder de checkout. Ver `main.ts` (referencia
# a `docker exec showly-redis-1`) y `docs/smoke-e2e.md`.
name: showly

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: showly
      POSTGRES_PASSWORD: showly
      POSTGRES_DB: showly
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # WAHA — WhatsApp HTTP API (no oficial). Escanea el QR en http://localhost:3000/dashboard
  # Engine NOWEB (Baileys): sin Chromium, ~30% más liviano y con arm64 nativo.
  # Tags separados por arquitectura: `noweb` (x86_64, default) · `noweb-arm`
  # (Apple Silicon). En Mac M1/M2 poné en `.env`: WAHA_IMAGE_TAG=noweb-arm
  waha:
    image: devlikeapro/waha:${WAHA_IMAGE_TAG:-noweb}
    ports:
      - "3000:3000"
    environment:
      # engine por defecto al crear sesiones. NOWEB = Baileys, sin browser.
      # Nota: NOWEB no soporta botones/listas interactivas (solo WEBJS/WPP).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # token que WAHA exige en el header 'X-Api-Key'. Debe coincidir con
      # WAHA_API_KEY del backend (compose lee el `.env` de la raíz).
      WAHA_API_KEY: ${WAHA_API_KEY:-dev-waha-key}
      # WAHA enviará los eventos entrantes a nuestro backend.
      # Default apunta al host desde el container (backend corriendo con `pnpm dev`).
      # En modo full-docker (backend dentro del compose), overridear: WAHA_HOOK_URL=http://backend:4000/webhooks/waha
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_URL:-http://host.docker.internal:4000/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: message,session.status
      # ── Media (M10, PR 1) ───────────────────────────────────────────────
      # Sin esto NOWEB entrega `hasMedia: true` con `media: null`: detecta el
      # adjunto pero no lo descarga, así que no hay nada que transcribir.
      WAHA_MEDIA_STORAGE: ${WAHA_MEDIA_STORAGE:-POSTGRESQL}
      WAHA_MEDIA_POSTGRESQL_URL: ${WAHA_MEDIA_POSTGRESQL_URL:-postgresql://${POSTGRES_USER:-showly}:${POSTGRES_PASSWORD:-showly}@db:5432/${POSTGRES_DB:-showly}}
      # Cuánto vive el fichero antes de que WAHA lo borre solo. El default de
      # WAHA son 180 s, que deja sin audio a cualquier reintento de la cola de
      # transcripción; y `0` lo desactiva, que acumularía audio de pacientes
      # indefinidamente. 15 min es el punto medio: margen para reintentar sin
      # convertir la base en un archivo de grabaciones clínicas.
      WHATSAPP_FILES_LIFETIME: ${WHATSAPP_FILES_LIFETIME:-900}
      # Header compartido que el backend valida contra WEBHOOK_TOKEN
      # (`webhook-auth.util.ts`). WAHA lo lee de WHATSAPP_HOOK_CUSTOM_HEADERS;
      # dejamos también el nombre viejo por compatibilidad entre versiones.
      # Si tu build de WAHA no manda el header, en dev podés poner en `.env`
      # ALLOW_WEBHOOK_WITHOUT_TOKEN=true (sólo dev, ver webhook.controller.ts).
      WHATSAPP_HOOK_CUSTOM_HEADERS: "x-webhook-token:${WEBHOOK_TOKEN:-dev-webhook-token}"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      # Dashboard http://localhost:3000/dashboard (QR) y swagger en /.
      WAHA_DASHBOARD_ENABLED: "true"
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-admin}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-admin}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:-admin}
    extra_hosts:
      # Linux no resuelve host.docker.internal solo (Docker Desktop sí).
      - "host.docker.internal:host-gateway"
    volumes:
      - waha_sessions:/app/.sessions
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -H \"X-Api-Key: $$WAHA_API_KEY\" http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


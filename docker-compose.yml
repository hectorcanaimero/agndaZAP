# Nombre del proyecto compose: aterriza los containers como `showly-*`
# sin depender del nombre del folder de checkout. Ver `main.ts` (referencia
# a `docker exec showly-redis-1`) y `docs/smoke-e2e.md`.
name: showly

services:
  db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_USER: showly
      POSTGRES_PASSWORD: showly
      POSTGRES_DB: showly
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U showly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # WAHA — WhatsApp HTTP API (no oficial). Escanea el QR en http://localhost:3000
  # Engine NOWEB (Baileys): sin Chromium, ~30% más liviano y con arm64 nativo.
  # Tags separados por arquitectura: `noweb-arm` (Apple Silicon) · `noweb` (x86).
  # En prod x86, sobreescribí: WAHA_IMAGE_TAG=noweb
  waha:
    image: devlikeapro/waha:${WAHA_IMAGE_TAG:-noweb-arm}
    ports:
      - "3000:3000"
    environment:
      # engine por defecto al crear sesiones. NOWEB = Baileys, sin browser.
      # Nota: NOWEB no soporta botones/listas interactivas (solo WEBJS/WPP).
      WHATSAPP_DEFAULT_ENGINE: NOWEB
      # token que WAHA exige en el header 'X-Api-Key'
      WAHA_API_KEY: ${WAHA_API_KEY:-dev-waha-key}
      # WAHA enviará los eventos entrantes a nuestro backend.
      # Default apunta al host desde el container (backend corriendo con `pnpm dev:backend`).
      # En modo full-docker (backend dentro del compose), overridear: WAHA_HOOK_URL=http://backend:4000/webhooks/waha
      WHATSAPP_HOOK_URL: ${WAHA_HOOK_URL:-http://host.docker.internal:4000/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: message,session.status
      # NOTA: WAHA community (noweb-arm/noweb) NO envía headers custom
      # (WHATSAPP_HOOK_HEADERS es feature Plus). En prod, usar WEBHOOK_HMAC
      # o reverse-proxy con auth antes del endpoint.
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
    volumes:
      - waha_sessions:/app/.sessions

  backend:
    build: ./apps/backend
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://showly:showly@db:5432/showly
      REDIS_URL: redis://redis:6379
      WAHA_BASE_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY:-dev-waha-key}
      WEBHOOK_TOKEN: ${WEBHOOK_TOKEN:-dev-webhook-token}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      # LLM router (reuso del patrón de Blog Condor)
      BOT_LLM_PROVIDER: deepseek
      BOT_LLM_FALLBACK: gemini
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}  # embeddings FAQ
    ports:
      - "4000:4000"

volumes:
  db_data:
  redis_data:
  waha_sessions:
